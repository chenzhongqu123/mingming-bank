<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏦 明哲成长银行 · 仪表盘</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;900&display=swap');

:root {
  --bg-dark: #0a0502;
  --bg-panel: #0d0805;
  --bronze: #CD7F32;
  --gold: #FFD700;
  --gold-dim: #B8860B;
  --text-light: #E0E0E0;
  --text-muted: #A09080;
  --card-bg: rgba(45, 24, 16, 0.65);
  --border-color: rgba(205, 127, 50, 0.25);
  --card-radius: 12px;
  --shadow-glow: 0 0 20px rgba(205, 127, 50, 0.15);
  --font: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg-dark);
  font-family: var(--font);
  color: var(--text-light);
  overflow-x: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px;
  background:
    radial-gradient(ellipse 80% 60% at 50% 20%, rgba(205,127,50,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 20% 70%, rgba(205,127,50,0.04) 0%, transparent 60%),
    var(--bg-dark);
  min-height: 100vh;
}

/* ===== MAIN CONTAINER ===== */
.dashboard {
  width: 1024px;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ===== TOP NAVBAR ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);
  box-shadow: var(--shadow-glow);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar-icon {
  font-size: 24px;
}

.topbar-bank {
  font-size: 20px;
  font-weight: 700;
  color: var(--gold);
  text-shadow: 0 0 8px rgba(255,215,0,0.25);
  letter-spacing: 1px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.topbar-tier {
  font-size: 15px;
  font-weight: 700;
  color: var(--bronze);
  padding: 4px 14px;
  border: 1px solid rgba(205,127,50,0.3);
  border-radius: 20px;
  background: rgba(205,127,50,0.08);
}

.topbar-date {
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== MAIN GRID (2 columns) ===== */
.main-grid {
  display: grid;
  grid-template-columns: 400px 1fr;
  gap: 8px;
}

/* ===== LEFT COLUMN ===== */
.left-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ===== CARD PANEL (tier card) ===== */
.card-panel {
  background:
    repeating-linear-gradient(60deg, transparent, transparent 30px, rgba(205,127,50,0.025) 30px, rgba(205,127,50,0.025) 31px),
    repeating-linear-gradient(-60deg, transparent, transparent 30px, rgba(205,127,50,0.02) 30px, rgba(205,127,50,0.02) 31px),
    linear-gradient(135deg, #1a0f0a, #2d1810, #1a0f0a);
  border-radius: var(--card-radius);
  border: 1px solid var(--border-color);
  padding: 14px 18px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-glow);
}

.card-panel::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 30%, rgba(205,127,50,0.1) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 70%, rgba(205,127,50,0.06) 0%, transparent 50%);
  pointer-events: none;
}

.card-content {
  position: relative;
  z-index: 2;
}

/* Corners */
.card-panel .corner {
  position: absolute;
  width: 30px; height: 30px;
  pointer-events: none;
  opacity: 0.2;
}
.card-panel .corner.tl { top:0; left:0; border-top:2px solid var(--bronze); border-left:2px solid var(--bronze); }
.card-panel .corner.tr { top:0; right:0; border-top:2px solid var(--bronze); border-right:2px solid var(--bronze); }
.card-panel .corner.bl { bottom:0; left:0; border-bottom:2px solid var(--bronze); border-left:2px solid var(--bronze); }
.card-panel .corner.br { bottom:0; right:0; border-bottom:2px solid var(--bronze); border-right:2px solid var(--bronze); }

/* Avatar + info */
.card-top {
  display: flex;
  align-items: center;
  gap: 14px;
}

.card-avatar-wrapper {
  position: relative;
  flex-shrink: 0;
}

.card-avatar-wrapper::before {
  content: '';
  position: absolute;
  top: -3px; left: -3px;
  width: 66px; height: 66px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(205,127,50,0.25) 0%, transparent 70%);
}

.card-avatar {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 2px solid var(--bronze);
  box-shadow: 0 0 12px rgba(205,127,50,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #2d1810, #1a0f0a);
  position: relative;
  z-index: 2;
}

.card-avatar span {
  color: var(--bronze);
  font-size: 18px;
  font-weight: 900;
  text-shadow: 0 0 6px rgba(205,127,50,0.3);
}

.card-info { flex:1; }

.card-name {
  font-size: 22px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 8px rgba(255,215,0,0.2);
  letter-spacing: 1px;
  line-height: 1.3;
}

.card-tier {
  font-size: 14px;
  font-weight: 600;
  color: var(--bronze);
}

.card-stars {
  display: flex;
  gap: 4px;
  margin-top: 2px;
}
.card-stars .star { font-size: 16px; }
.card-stars .star.active { color: var(--gold); text-shadow: 0 0 6px rgba(255,215,0,0.4); }
.card-stars .star.inactive { color: #5a4a30; }

.card-divider {
  height: 1px;
  margin: 6px 0;
  background: linear-gradient(90deg, transparent, rgba(205,127,50,0.4), transparent);
}

.card-points {
  display: flex;
  gap: 0;
}

.card-points-item {
  flex:1;
  text-align: center;
  position: relative;
}
.card-points-item:first-child {
  border-right: 1px solid rgba(205,127,50,0.3);
}

.card-points-label {
  font-size: 12px;
  color: var(--gold-dim);
  letter-spacing: 1px;
}

.card-points-value {
  font-size: 28px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(255,215,0,0.25);
  line-height: 1.3;
}

.card-points-sub {
  font-size: 11px;
  color: var(--text-muted);
}

.card-points-sub span { color: var(--bronze); font-weight: 600; }

/* Progress bottom */
.card-bottom {
  margin-top: 4px;
}

.card-next-label {
  font-size: 12px;
  color: #B89870;
  margin-bottom: 4px;
}

.card-next-label span { color: var(--bronze); font-weight: 700; }

.card-progress-track {
  width:100%; height: 14px;
  background: rgba(255,255,255,0.06);
  border-radius: 7px;
  overflow:hidden;
  position:relative;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}

.card-progress-fill {
  height:100%;
  border-radius:7px;
  background: linear-gradient(90deg, #CD7F32, #B8860B);
  box-shadow: 0 0 10px rgba(205,127,50,0.5), inset 0 0 4px rgba(255,215,0,0.15), inset 0 1px 0 rgba(255,255,255,0.12);
  position:relative;
  transition: width 0.6s ease;
}

.card-progress-fill::after {
  content: '';
  position: absolute;
  top:0; left:0;
  width:100%; height:50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
  border-radius: 7px 7px 0 0;
}

.card-progress-text {
  position: absolute;
  right: 4px; top:50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  text-shadow: 0 0 4px rgba(255,215,0,0.5), 0 1px 2px rgba(0,0,0,0.6);
  z-index:3;
  pointer-events:none;
}

/* ===== BLIND BOX PANEL ===== */
.blindbox-panel {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.blindbox-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.blindbox-icon {
  font-size: 32px;
  line-height: 1;
}

.blindbox-info h3 {
  font-size: 14px;
  color: var(--gold-dim);
  letter-spacing: 1px;
}

.blindbox-count {
  font-size: 24px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 8px rgba(255,215,0,0.2);
  line-height: 1.2;
}

.blindbox-btn {
  padding: 8px 20px;
  border-radius: 20px;
  border: none;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}

.blindbox-btn.active {
  background: linear-gradient(135deg, #CD7F32, #B8860B);
  color: #fff;
  box-shadow: 0 0 16px rgba(205,127,50,0.4);
}

.blindbox-btn.active:hover {
  box-shadow: 0 0 24px rgba(205,127,50,0.6);
  transform: scale(1.03);
}

.blindbox-btn.disabled {
  background: rgba(255,255,255,0.06);
  color: #5a4a30;
  cursor: not-allowed;
}

/* ===== ACHIEVEMENT WALL ===== */
.achieve-panel {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);
  padding: 14px 18px;
}

.achieve-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.achieve-header h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold-dim);
  letter-spacing: 1px;
}

.achieve-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.achieve-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(205,127,50,0.1);
  transition: all 0.3s;
}

.achieve-item.unlocked {
  border-color: rgba(255,215,0,0.3);
  background: rgba(255,215,0,0.04);
}

.achieve-icon {
  font-size: 22px;
  line-height: 1;
}

.achieve-icon.unlocked {
  filter: drop-shadow(0 0 6px rgba(255,215,0,0.4));
}

.achieve-icon.locked {
  filter: grayscale(0.8);
  opacity: 0.4;
}

.achieve-name {
  font-size: 11px;
  color: var(--text-muted);
}

.achieve-item.unlocked .achieve-name {
  color: var(--gold);
}

/* ===== RIGHT COLUMN ===== */
.right-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ===== SECTION PANEL (common) ===== */
.panel {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);
  padding: 12px 16px;
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.panel-header h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold-dim);
  letter-spacing: 1px;
}

.panel-header .badge {
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(255,255,255,0.05);
  padding: 2px 8px;
  border-radius: 10px;
}

/* ===== TODAY'S DYNAMICS ===== */
.today-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.today-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  border: 1px solid rgba(205,127,50,0.08);
}

.today-item-left {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-light);
}

.today-item-left .status-icon.confirmed { color: #4CAF50; }
.today-item-left .status-icon.pending { color: #FF9800; }

.today-item-right {
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
}

/* ===== GROWTH CHART ===== */
.chart-container {
  width: 100%;
  height: 140px;
  position: relative;
}

#growthChart {
  width: 100%;
  height: 100%;
  display: block;
}

.chart-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 2px;
  padding: 0 4px;
}

.chart-labels span {
  font-size: 10px;
  color: var(--text-muted);
}

/* ===== EXCHANGE SHOP ===== */
.exchange-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.exchange-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  background: rgba(255,255,255,0.025);
  border-radius: 6px;
  border: 1px solid rgba(205,127,50,0.06);
}

.exchange-info {
  display: flex;
  flex-direction: column;
}

.exchange-name {
  font-size: 13px;
  color: var(--text-light);
}

.exchange-price {
  font-size: 11px;
  color: var(--text-muted);
}

.exchange-price span {
  color: var(--gold);
  font-weight: 600;
}

.exchange-btn {
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid rgba(205,127,50,0.3);
  background: rgba(205,127,50,0.1);
  color: var(--bronze);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.3s;
}

.exchange-btn:hover {
  background: rgba(205,127,50,0.25);
  box-shadow: 0 0 8px rgba(205,127,50,0.2);
}

/* ===== BALANCE TAG ===== */
.balance-tag {
  margin-left: auto;
  font-size: 13px;
  color: var(--gold);
  background: rgba(255,215,0,0.06);
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 600;
}

.balance-tag span { color: var(--text-muted); font-weight: 400; }

/* ===== TRANSACTION TABLE ===== */
.tx-panel {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);
  padding: 14px 18px;
}

.tx-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
}

.tx-table th {
  text-align: left;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid rgba(205,127,50,0.15);
  letter-spacing: 1px;
}

.tx-table td {
  padding: 7px 10px;
  font-size: 13px;
  border-bottom: 1px solid rgba(205,127,50,0.06);
}

.tx-table tr:last-child td { border-bottom: none; }

.tx-type {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 12px;
  background: rgba(205,127,50,0.1);
  color: var(--bronze);
}

.tx-amount.positive { color: #4CAF50; font-weight: 700; }
.tx-amount.negative { color: #F44336; font-weight: 700; }

.tx-scroll {
  max-height: 180px;
  overflow-y: auto;
}

.tx-scroll::-webkit-scrollbar { width: 4px; }
.tx-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 2px; }
.tx-scroll::-webkit-scrollbar-thumb { background: rgba(205,127,50,0.2); border-radius: 2px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 860px) {
  body { padding: 10px; }
  .dashboard { width: 100%; }
  .main-grid {
    grid-template-columns: 1fr;
  }
  .today-grid,
  .exchange-list {
    grid-template-columns: 1fr;
  }
  .achieve-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .topbar-bank { font-size: 16px; }
  .topbar-tier { font-size: 13px; }

  .card-points-value { font-size: 24px; }
  .card-name { font-size: 19px; }
  .card-points-item { padding: 2px 0; }
}

@media (max-width: 480px) {
  .achieve-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .topbar-date { display: none; }
  .card-avatar { width: 46px; height: 46px; }
  .card-avatar span { font-size: 14px; }
  .card-points-value { font-size: 20px; }
  .blindbox-count { font-size: 20px; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
::-webkit-scrollbar-thumb { background: rgba(205,127,50,0.15); border-radius: 3px; }

/* ===== ANIMATIONS ===== */
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(205,127,50,0.3); }
  50% { box-shadow: 0 0 20px rgba(205,127,50,0.6); }
}

.card-panel {
  animation: pulse-glow 3s ease-in-out infinite;
}
</style>
<script>
(function(){
  var pwd = localStorage.getItem('site_auth');
  if (pwd !== '720720') {
    var input = prompt('请输入访问密码：');
    if (input === '720720') {
      localStorage.setItem('site_auth', '720720');
    } else {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0502;color:#CD7F32;font-size:24px;font-family:sans-serif;">密码错误，请刷新重试</div>';
      throw new Error('auth failed');
    }
  }
})();
</script>
</head>

// ===== RENDER FUNCTIONS =====
function fmtDate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const weekdays = ['日','一','二','三','四','五','六'];
  return `${y}-${m}-${day} 周${weekdays[d.getDay()]}`;
}

function renderTopbar(data) {

  document.getElementById('cardTier').textContent = data.tier.name;

  document.getElementById('pointsNeeded').textContent = data.nextTier.pointsNeeded;
  document.getElementById('progressFill').style.width = data.progress + '%';
  document.getElementById('progressText').textContent = data.progress + '%';

  // Stars

    star.className = 'star ' + (i < data.tier.stars ? 'active' : 'inactive');
    star.textContent = i < data.tier.stars ? '⭐' : '☆';
    starContainer.appendChild(star);
  }
}

  grid.innerHTML = '';

    const div = document.createElement('div');
    div.className = 'today-item';
    const isConfirmed = r.status === 'confirmed';
    div.innerHTML = `
      <div class="today-item-left">
        <span class="status-icon ${isConfirmed ? 'confirmed' : 'pending'}">${isConfirmed ? '✅' : '⏳'}</span>
        <span>${r.desc}</span>
      </div>
      <div class="today-item-right">+${r.points}</div>
    `;
    grid.appendChild(div);
  });
}

function drawChart(data) {
  const canvas = document.getElementById('growthChart');
  const parent = canvas.parentElement;
  const rect = parent.getBoundingClientRect();
  const w = rect.width || 500;
  const h = 140;
  canvas.width = w * 2;
  canvas.height = h * 2;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);

  const pad = { top: 15, bottom: 20, left: 35, right: 15 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  // Clear
  ctx.clearRect(0, 0, w, h);

  const weekData = data.weeklyData;
  const maxVal = Math.max(...weekData.map(d => d.points), 10);
  const yMax = Math.ceil(maxVal * 1.15 / 10) * 10;

  // Grid lines
  ctx.strokeStyle = 'rgba(205,127,50,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (plotH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
  }

  // Y-axis labels
  ctx.fillStyle = 'rgba(160,144,128,0.6)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (plotH / 4) * i;
    const val = Math.round(yMax - (yMax / 4) * i);
    ctx.fillText(val, pad.left - 4, y + 3);
  }

  // X-axis labels
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(160,144,128,0.6)';
  weekData.forEach((d, i) => {
    const x = pad.left + (plotW / (weekData.length - 1 || 1)) * i;
    ctx.fillText(d.day, x, h - pad.bottom + 12);
  });

  // Fill area under line with gradient
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top + plotH);
  weekData.forEach((d, i) => {
    const x = pad.left + (plotW / (weekData.length - 1 || 1)) * i;
    const y = pad.top + plotH - (d.points / yMax) * plotH;
    ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + plotW, pad.top + plotH);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
  grad.addColorStop(0, 'rgba(205,127,50,0.5)');
  grad.addColorStop(0.3, 'rgba(205,127,50,0.25)');
  grad.addColorStop(0.6, 'rgba(205,127,50,0.1)');
  grad.addColorStop(1, 'rgba(205,127,50,0.03)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Y-axis tick marks
  ctx.strokeStyle = 'rgba(205,127,50,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (plotH / 4) * i;
    // Tick mark (short dash on the right side of Y-axis)
    ctx.beginPath();
    ctx.moveTo(pad.left - 2, y);
    ctx.lineTo(pad.left + 2, y);
    ctx.stroke();
  }

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#CD7F32';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = 'rgba(205,127,50,0.5)';
  ctx.shadowBlur = 6;
  weekData.forEach((d, i) => {
    const x = pad.left + (plotW / (weekData.length - 1 || 1)) * i;
    const y = pad.top + plotH - (d.points / yMax) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Dots at data points
  weekData.forEach((d, i) => {
    const x = pad.left + (plotW / (weekData.length - 1 || 1)) * i;
    const y = pad.top + plotH - (d.points / yMax) * plotH;
    // Outer glow
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = d.points > 0 ? '#FFD700' : '#5a4a30';
    ctx.shadowColor = 'rgba(205,127,50,0.8)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    // Inner dot
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = d.points > 0 ? '#FFF8DC' : '#8B7355';
    ctx.fill();
  });

  // X-axis labels (also in HTML for responsiveness)
  const labelContainer = document.getElementById('chartLabels');
  labelContainer.innerHTML = '';
  weekData.forEach(d => {
    const span = document.createElement('span');
    span.textContent = d.day;
    labelContainer.appendChild(span);
  });
}
