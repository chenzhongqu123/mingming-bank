<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>⭐ 升星时刻</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── 容器 ── */
.animation-container {
  width: 1024px; height: 768px;
  margin: 0 auto;
  background: linear-gradient(135deg, #0a0502, #1a0f0a, #0d0805);
  position: relative;
  overflow: hidden;
  font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  color: #E0E0E0;
}

/* ── 舞台：默认隐藏所有子元素 ── */
.stage { position: relative; width: 100%; height: 100%; }
.stage > * { opacity: 0; }

/* ── 舞台激活：触发所有动画 ── */
.stage.active > * { opacity: 1; }

/* ════ 共享keyframes ════ */
@keyframes fadeIn { to { opacity: 1; } }
@keyframes slideUpFade {
  0% { transform: translateY(30px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

/* ════ 1. 屏幕震动（开始瞬间） ════ */
.stage.active {
  animation: screenShake 0.4s ease-in-out;
  animation-delay: 0.8s;
}
@keyframes screenShake {
  0%, 100% { transform: translate(0,0); }
  20% { transform: translate(-4px,2px); }
  40% { transform: translate(4px,-2px); }
  60% { transform: translate(-2px,4px); }
  80% { transform: translate(2px,-4px); }
}

/* ════ 2. 爆发光环（CSS模拟粒子效果） ════ */
.burst-ring {
  position: absolute;
  top: 28%; left: 50%;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 3px solid #FFD700;
  transform: translate(-50%,-50%) scale(0);
  box-shadow: 0 0 30px rgba(255,215,0,0.6);
  pointer-events: none;
}
.stage.active .burst-ring {
  animation: ringBurst 1.5s ease-out forwards;
  animation-delay: 0.8s;
}
.stage.active .burst-ring.delay1 { animation-delay: 1.0s; }
.stage.active .burst-ring.delay2 { animation-delay: 1.2s; }

@keyframes ringBurst {
  0%   { transform: translate(-50%,-50%) scale(0);   opacity: 1; border-width: 5px; }
  100% { transform: translate(-50%,-50%) scale(40);  opacity: 0; border-width: 1px; }
}

/* ════ 3. 段位emoji ════ */
.tier-emoji {
  font-size: 120px;
  text-align: center;
  margin-top: 60px;
  filter: drop-shadow(0 0 40px rgba(205,127,50,0.6));
}
.stage.active .tier-emoji {
  animation: emojiPop 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
  animation-delay: 1.5s;
}
@keyframes emojiPop {
  0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
  60%  { transform: scale(1.3) rotate(10deg);  opacity: 1; }
  100% { transform: scale(1) rotate(0);        opacity: 1; }
}

/* ════ 4. 升星文字 ════ */
.star-text {
  font-size: 36px;
  font-weight: 900;
  color: #FFD700;
  text-align: center;
  margin-top: 20px;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
}
.stage.active .star-text {
  animation: slideUpFade 0.5s ease-out forwards;
  animation-delay: 2.5s;
}

/* ════ 5. 段位名 ════ */
.tier-name {
  font-size: 28px;
  font-weight: 700;
  color: #CD7F32;
  text-align: center;
  margin-top: 10px;
  text-shadow: 0 0 10px rgba(205,127,50,0.3);
}
.stage.active .tier-name {
  animation: slideUpFade 0.5s ease-out forwards;
  animation-delay: 3.0s;
}

/* ════ 6. 积分变化 ════ */
.points-change {
  font-size: 32px;
  text-align: center;
  margin-top: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}
.points-old {
  color: #888;
  text-decoration: line-through;
}
.points-new {
  color: #FFD700;
  font-weight: 900;
  font-size: 40px;
  text-shadow: 0 0 15px rgba(255,215,0,0.4);
}
.points-diff { color: #CD7F32; font-size: 20px; }
.arrow { color: #CD7F32; font-size: 28px; }
.stage.active .points-change {
  animation: slideUpFade 0.5s ease-out forwards;
  animation-delay: 3.5s;
}

/* ════ 7. 盲盒 ════ */
.gift-box {
  background: rgba(205,127,50,0.15);
  border: 1px solid rgba(205,127,50,0.4);
  border-radius: 16px;
  padding: 20px 40px;
  text-align: center;
  margin: 30px auto 0;
  max-width: 400px;
  backdrop-filter: blur(10px);
}
.gift-icon { font-size: 48px; }
.gift-text { font-size: 20px; color: #FFD700; margin: 8px 0; }
.gift-btn {
  background: linear-gradient(180deg, #FFD700, #B8860B);
  color: #1a0f0a;
  border: 2px solid #FFD700;
  padding: 12px 36px;
  border-radius: 30px;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 10px;
  animation: giftPulse 1.5s ease-in-out infinite;
}
@keyframes giftPulse {
  0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.3); }
  50%      { box-shadow: 0 0 35px rgba(255,215,0,0.6); }
}
.stage.active .gift-box {
  animation: slideUpFade 0.6s ease-out forwards;
  animation-delay: 4.5s;
}

/* ════ 8. 底部品牌 ════ */
.brand {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(205,127,50,0.3);
}
.stage.active .brand {
  animation: fadeIn 1s ease-out forwards;
  animation-delay: 5s;
}

/* ════ 开始遮罩 ════ */
.start-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10,5,2,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.5s;
}
.start-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.start-title {
  font-size: 48px;
  font-weight: 900;
  color: #FFD700;
  text-shadow: 0 0 30px rgba(255,215,0,0.4);
  margin-bottom: 16px;
}
.start-sub {
  font-size: 20px;
  color: #aaa;
  margin-bottom: 40px;
}
.start-btn {
  background: linear-gradient(180deg, #FFD700, #B8860B);
  color: #1a0f0a;
  border: none;
  padding: 16px 48px;
  border-radius: 30px;
  font-size: 24px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255,215,0,0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}
.start-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px rgba(255,215,0,0.5);
}

/* ════ 进度条 ════ */
.progress-bar {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
  z-index: 50;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #CD7F32, #FFD700);
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* ════ 控制按钮 ════ */
.controls {
  position: absolute;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 10px;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.5s;
}
.controls.visible { opacity: 1; }
.ctrl-btn {
  background: rgba(205,127,50,0.2);
  border: 1px solid rgba(205,127,50,0.4);
  color: #E0E0E0;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
.ctrl-btn:hover { background: rgba(205,127,50,0.4); }
</style>
</head>
<body>

<div class="animation-container">

  <!-- 进度条 -->
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <!-- 控制按钮 -->
  <div class="controls" id="controls">
    <button class="ctrl-btn" id="replayBtn">🔄 重播</button>
    <button class="ctrl-btn" id="skipBtn">⏭ 跳过</button>
  </div>

  <!-- 主舞台 -->
  <div class="stage" id="stage">
    <div class="burst-ring"></div>
    <div class="burst-ring delay1"></div>
    <div class="burst-ring delay2"></div>

    <div class="tier-emoji" id="tierEmoji">🥉</div>
    <div class="star-text">⭐ 升星成功！⭐</div>
    <div class="tier-name" id="tierName">倔强青铜Ⅲ</div>

    <div class="points-change">
      <span class="points-old" id="pointsOld">100</span>
      <span class="arrow">→</span>
      <span class="points-new" id="pointsNew">150</span>
      <span class="points-diff">(+50分)</span>
    </div>

    <div class="gift-box" id="giftBox">
      <div class="gift-icon">🎁</div>
      <div class="gift-text">你获得了 1 个盲盒！</div>
      <button class="gift-btn" id="giftBtn">🎁 点击开启</button>
    </div>

    <div class="brand">🏦 明哲成长银行 · 2026</div>
  </div>

  <!-- 开始遮罩 -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-title">⭐ 升星时刻 ⭐</div>
    <div class="start-sub">点击开始，见证荣耀</div>
    <button class="start-btn" id="startBtn">🏆 点击开始</button>
  </div>

</div>

<script>
const upgradeData = {
  fromTier: "🥉倔强青铜Ⅲ",
  toTier: "🥉倔强青铜Ⅲ⭐",
  fromPoints: 100,
  toPoints: 150,
  blindBoxCount: 1,
  tierColor: "#CD7F32",
  tierEmoji: "🥉",
};

// ── Web Audio 音效 ──
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type='sine', vol=0.1, delay=0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}
function playAllSfx() {
  initAudio();
  playTone(80, 0.3, 'sawtooth', 0.08, 0.8);
  playTone(200, 0.4, 'square', 0.05, 0.8);
  [261, 329, 392].forEach(f => playTone(f, 0.8, 'sine', 0.06, 1.5));
  playTone(2093, 0.15, 'sine', 0.12, 2.5);
  playTone(2637, 0.2, 'sine', 0.1, 2.6);
  for (let i = 0; i < 8; i++) playTone(800 + i*50, 0.05, 'sine', 0.05, 3.5 + i*0.12);
  for (let i = 0; i < 6; i++) playTone(2000 + Math.random()*2000, 0.15, 'sine', 0.04, 4.5 + i*0.08);
}

// ── 开始 ──
document.getElementById('startBtn').addEventListener('click', function() {
  document.getElementById('startOverlay').classList.add('hidden');
  const stage = document.getElementById('stage');
  stage.classList.add('active');
  document.getElementById('controls').classList.add('visible');
  playAllSfx();
  const p = document.getElementById('progress');
  [[0,0],[800,15],[1500,35],[2500,55],[3500,75],[4500,90],[5500,100]]
    .forEach(([t,v]) => setTimeout(() => p.style.width = v + '%', t));
  const pe = document.getElementById('pointsNew');
  let cur = upgradeData.fromPoints;
  const tgt = upgradeData.toPoints;
  setTimeout(() => {
    const iv = setInterval(() => {
      cur += Math.ceil((tgt - cur) / 5);
      if (cur >= tgt) { cur = tgt; clearInterval(iv); }
      pe.textContent = cur;
    }, 100);
  }, 3500);
});

// ── 重播 ──
document.getElementById('replayBtn').addEventListener('click', function() {
  const stage = document.getElementById('stage');
  stage.classList.remove('active');
  setTimeout(() => {
    document.getElementById('startOverlay').classList.remove('hidden');
    document.getElementById('controls').classList.remove('visible');
    document.getElementById('progress').style.width = '0%';
    document.getElementById('pointsNew').textContent = upgradeData.toPoints;
  }, 300);
});

// ── 跳过 ──
document.getElementById('skipBtn').addEventListener('click', function() {
  const stage = document.getElementById('stage');
  stage.classList.remove('active');
  void stage.offsetWidth;
  stage.classList.add('active');
  document.getElementById('progress').style.width = '100%';
  document.getElementById('pointsNew').textContent = upgradeData.toPoints;
});

// ── 盲盒 ──
document.getElementById('giftBtn').addEventListener('click', function() {
  const reward = Math.floor(Math.random() * 20) + 1;
  alert('🎁 恭喜！盲盒开出 +' + reward + ' 分！');
});
</script>
</body>
</html>
