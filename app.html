<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦸%3C/text%3E%3C/svg%3E">
<title>🦸 成长小英雄 · 明哲版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

:root {
  --bg: #0a0502; --panel: rgba(45,24,16,.65); --panel2: rgba(10,5,2,.38);
  --bronze: #CD7F32; --gold: #FFD700; --gold-soft: #f5d78e;
  --text: #f5e6d0; --dim: #b89f85; --red: #ff7b6b; --green: #7ee08a;
  --line: rgba(205,127,50,.25);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background: var(--bg); }
body {
  font-family:'Noto Sans SC','微软雅黑','PingFang SC',sans-serif; color:var(--text);
  min-height:100dvh;
  background: radial-gradient(1200px 500px at 50% -10%, rgba(205,127,50,.14), transparent 60%),
              radial-gradient(800px 400px at 90% 110%, rgba(120,60,20,.10), transparent 60%), var(--bg);
}
#app { max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;
  padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
@media (min-width:560px){ #app{ border-left:1px solid var(--line); border-right:1px solid var(--line); box-shadow:0 0 60px rgba(0,0,0,.6);} }

/* ===== 顶栏 ===== */
.mhead { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(15,8,4,.86); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
.mhead-left { display:flex; align-items:center; gap:10px; min-width:0; }
.logo { width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center; font-size:22px;
  border-radius:12px; background:linear-gradient(145deg,#3a2213,#241108); border:1px solid rgba(205,127,50,.45);
  box-shadow: inset 0 1px 0 rgba(255,215,0,.18); }
.app-name { font-size:16px; font-weight:900; letter-spacing:.5px; }
.saver { font-size:12px; color:var(--dim); margin-top:1px; }
.mhead-right { text-align:right; flex:none; }
.tier-chip { display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px;
  color:var(--gold-soft); background:rgba(205,127,50,.16); border:1px solid rgba(205,127,50,.5); white-space:nowrap; }
.mdate { font-size:11px; color:var(--dim); margin-top:4px; }
.parent-btn { margin-top:4px; font-size:11px; color:var(--dim); background:none; border:1px solid var(--line);
  border-radius:8px; padding:2px 8px; font-family:inherit; cursor:pointer; }
.parent-btn.on { color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32); border:none; font-weight:700; }

/* buff 条 + 备份提醒条 */
.strip { display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:12px; font-weight:700;
  border-bottom:1px solid var(--line); }
#buffStrip { display:none; background:rgba(126,224,138,.08); border-bottom-color:rgba(126,224,138,.3); color:var(--green); }
#buffStrip.on { display:flex; }
#backupStrip { display:none; background:rgba(255,215,0,.07); border-bottom-color:rgba(255,215,0,.3); color:var(--gold-soft); cursor:pointer; }
#backupStrip.on { display:flex; }

/* ===== 家长横幅 ===== */
#parentBar { display:none; flex-wrap:wrap; gap:6px; padding:10px 14px; background:rgba(255,215,0,.06);
  border-bottom:1px solid rgba(255,215,0,.25); }
#parentBar.on { display:flex; }
#parentBar button { min-height:36px; padding:0 12px; font-family:inherit; font-size:12px; font-weight:700;
  color:var(--gold-soft); background:rgba(205,127,50,.18); border:1px solid rgba(205,127,50,.5);
  border-radius:10px; cursor:pointer; }
#parentBar button.hot { color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32); border:none; }
#parentBar .badge { background:var(--red); color:#fff; border-radius:999px; padding:0 6px; margin-left:4px; font-size:11px; }

/* ===== 主体 ===== */
main { flex:1; padding:14px 14px 20px; }
.tab { display:none; animation:fadein .25s ease; }
.tab.on { display:block; }
@keyframes fadein { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.card-title { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; color:var(--gold-soft); margin-bottom:12px; }
.card-title .sub { margin-left:auto; font-size:11px; font-weight:400; color:var(--dim); }

/* ===== 周曲线 ===== */
#weekChart { width:100%; height:150px; display:block; }

/* ===== 任务列表 ===== */
.grp-title { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:900; color:var(--gold-soft); margin:8px 2px 8px; }
.grp-title:first-child { margin-top:0; }
.grp-tag { font-size:10px; font-weight:700; color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32); padding:2px 8px; border-radius:999px; }
.task-row { display:flex; align-items:center; gap:12px; padding:13px 14px; margin-bottom:10px; border-radius:12px;
  background:var(--panel2); border:1px solid rgba(205,127,50,.18); }
.task-ico { font-size:26px; width:34px; text-align:center; flex:none; }
.task-info { flex:1; min-width:0; }
.task-info .n { font-size:15px; font-weight:700; }
.task-info .n .cnt { font-size:11px; color:var(--gold); margin-left:6px; }
.task-info .p { font-size:12px; color:var(--dim); margin-top:3px; }
.task-info .p b { color:var(--gold-soft); }
.ck-btn { flex:none; min-height:44px; padding:0 16px; border:none; border-radius:12px; font-family:inherit;
  font-size:14px; font-weight:700; color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32);
  box-shadow:0 3px 10px rgba(205,127,50,.35); cursor:pointer; }
.ck-btn:active { transform:scale(.96); }
.ck-wait, .ck-done { flex:none; min-height:44px; display:flex; align-items:center; padding:0 14px; border-radius:12px;
  font-size:13px; font-weight:700; }
.ck-wait { color:var(--gold-soft); background:rgba(205,127,50,.14); border:1px dashed rgba(205,127,50,.5); }
.ck-done { color:var(--green); background:rgba(126,224,138,.10); border:1px solid rgba(126,224,138,.3); }
.bw-hint { font-size:11px; color:var(--gold); text-align:center; padding:6px 0 0; }

/* 待确认（家长视角） */
.pend-row { display:flex; align-items:center; gap:10px; padding:12px 14px; margin-bottom:10px; border-radius:12px;
  background:rgba(255,215,0,.05); border:1px solid rgba(255,215,0,.3); }
.pend-info { flex:1; min-width:0; }
.pend-info .n { font-size:14px; font-weight:700; }
.pend-info .m { font-size:11px; color:var(--dim); margin-top:3px; }
.pend-info .m b { color:var(--gold); }
.mini-btn { min-height:38px; padding:0 14px; border-radius:10px; font-family:inherit; font-size:13px; font-weight:700;
  cursor:pointer; border:1px solid rgba(205,127,50,.5); color:var(--gold-soft); background:rgba(205,127,50,.14); }
.mini-btn.go { color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32); border:none; }
.mini-btn.no { color:var(--red); background:rgba(255,110,90,.10); border-color:rgba(255,110,90,.4); }

/* ===== 段位 ===== */
.hero { text-align:center; padding:22px 16px 18px; border:1px solid rgba(205,127,50,.55); overflow:hidden;
  box-shadow:0 0 24px rgba(205,127,50,.18), inset 0 1px 0 rgba(255,215,0,.15); animation:heroGlow 3.2s ease-in-out infinite; }
@keyframes heroGlow { 0%,100%{box-shadow:0 0 18px rgba(205,127,50,.14), inset 0 1px 0 rgba(255,215,0,.15);} 50%{box-shadow:0 0 34px rgba(255,215,0,.22), inset 0 1px 0 rgba(255,215,0,.25);} }
.avatar { width:64px; height:64px; margin:0 auto 10px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:900; color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32 70%);
  box-shadow:0 0 0 3px rgba(10,5,2,.9), 0 0 0 5px rgba(205,127,50,.5), 0 4px 14px rgba(0,0,0,.5); }
.hero .hello { font-size:13px; color:var(--dim); }
.hero .tier-name { font-size:22px; font-weight:900; color:var(--gold); margin:2px 0 4px; text-shadow:0 2px 10px rgba(255,215,0,.25); }
.hero .title-line { font-size:12px; color:var(--gold-soft); margin-bottom:6px; }
.stars { font-size:18px; letter-spacing:4px; margin-bottom:12px; }
.stars .off { opacity:.22; filter:grayscale(1); }
.statline { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.statline .chip { font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
.statline .chip b { color:var(--gold); }
.bar-wrap { text-align:left; }
.bar-label { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:6px; }
.bar-label b { color:var(--gold-soft); }
.bar { height:12px; border-radius:999px; background:rgba(10,5,2,.6); border:1px solid rgba(205,127,50,.35); overflow:hidden; }
.bar > i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#CD7F32,#FFD700);
  box-shadow:0 0 10px rgba(255,215,0,.5); transition:width .6s ease; }
.tier-map { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tier-cell { padding:10px; border-radius:10px; background:var(--panel2); border:1px solid rgba(205,127,50,.18); text-align:center; }
.tier-cell .tn { font-size:13px; font-weight:700; }
.tier-cell .tp { font-size:11px; color:var(--dim); margin-top:3px; }
.tier-cell.now { border-color:var(--gold); box-shadow:0 0 12px rgba(255,215,0,.2); }
.tier-cell.now .tp { color:var(--gold); }
.tier-cell.past { opacity:.45; }
.tier-cell.king { grid-column:1 / -1; border-color:rgba(255,111,0,.5); }
.hist-item { padding:10px 0; border-bottom:1px dashed rgba(205,127,50,.18); }
.hist-item:last-child { border-bottom:none; }
.hist-item .l1 { font-size:13px; font-weight:700; }
.hist-item .l1 .tag { font-size:10px; padding:1px 6px; border-radius:6px; margin-left:6px; color:#2a1503;
  background:linear-gradient(145deg,#FFD700,#CD7F32); }
.hist-item .l2 { font-size:11px; color:var(--dim); margin-top:3px; }

/* ===== 背包/道具 ===== */
.box-row { display:flex; align-items:center; gap:12px; padding:14px; margin-bottom:10px; border-radius:12px;
  background:var(--panel2); border:1px solid rgba(205,127,50,.25); }
.box-ico { font-size:32px; flex:none; }
.box-info { flex:1; min-width:0; }
.box-info .n { font-size:15px; font-weight:700; }
.box-info .m { font-size:11px; color:var(--dim); margin-top:3px; }
.item-row { display:flex; align-items:center; gap:12px; padding:14px; margin-bottom:10px; border-radius:12px;
  background:var(--panel2); border:1px solid rgba(126,224,138,.25); }
.item-row .n { font-size:15px; font-weight:700; }
.item-row .m { font-size:11px; color:var(--dim); margin-top:3px; }
.item-row .cnt { color:var(--gold); font-weight:900; }
.empty { padding:18px 10px; text-align:center; font-size:13px; color:var(--dim);
  border:1px dashed rgba(205,127,50,.25); border-radius:12px; line-height:1.7; }
.prob-tbl { width:100%; font-size:11px; color:var(--dim); border-collapse:collapse; margin-top:4px; }
.prob-tbl td { padding:3px 4px; border-bottom:1px dashed rgba(205,127,50,.15); }
.prob-tbl td:last-child { text-align:right; color:var(--gold-soft); }
.tx-item { border-radius:12px; padding:12px 14px; margin-bottom:10px; background:var(--panel2); border:1px solid rgba(205,127,50,.18); }
.tx-top { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.tx-date { font-size:12px; color:var(--dim); }
.tx-type { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; color:var(--gold-soft);
  background:rgba(205,127,50,.16); border:1px solid rgba(205,127,50,.4); white-space:nowrap; max-width:55%;
  overflow:hidden; text-overflow:ellipsis; }
.tx-type.neg { color:#ffb3a8; background:rgba(255,110,90,.12); border-color:rgba(255,110,90,.4); }
.tx-amt { margin-left:auto; font-size:16px; font-weight:900; color:var(--gold); white-space:nowrap; }
.tx-amt.neg { color:var(--red); }
.tx-desc { font-size:12px; color:var(--dim); line-height:1.6; word-break:break-all; }

/* ===== 我的/里程碑/成就/称号 ===== */
.me-head { display:flex; align-items:center; gap:14px; }
.ms-card { padding:14px; margin-bottom:10px; border-radius:12px; background:var(--panel2);
  border:1px solid rgba(205,127,50,.18); }
.ms-card.reach { border-color:rgba(255,215,0,.5); box-shadow:0 0 14px rgba(255,215,0,.12); }
.ms-card.done { opacity:.55; }
.ms-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ms-tier { font-size:11px; font-weight:700; color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32);
  padding:2px 8px; border-radius:6px; }
.ms-name { font-size:15px; font-weight:700; }
.ms-st { margin-left:auto; font-size:11px; color:var(--dim); }
.ms-card.reach .ms-st { color:var(--gold); font-weight:700; }
.ms-desc { font-size:12px; color:var(--dim); margin-top:6px; line-height:1.6; }
.achv-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.achv { text-align:center; padding:14px 6px 12px; border-radius:12px; background:var(--panel2); border:1px solid rgba(205,127,50,.18); position:relative; }
.achv .ico { font-size:28px; }
.achv .nm { font-size:12px; margin-top:6px; }
.achv .st { font-size:10px; margin-top:4px; color:var(--dim); }
.achv.got { border-color:rgba(255,215,0,.5); box-shadow:0 0 14px rgba(255,215,0,.12); }
.achv.got .st { color:var(--gold); font-weight:700; }
.achv:not(.got) .ico { filter:grayscale(1); opacity:.4; }
.achv .topmark { position:absolute; top:6px; right:8px; font-size:10px; }
.title-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.title-cell { text-align:center; padding:12px 6px; border-radius:12px; background:var(--panel2);
  border:1px solid rgba(205,127,50,.18); cursor:pointer; }
.title-cell.own { border-color:rgba(255,215,0,.45); }
.title-cell.eq { border-color:var(--gold); box-shadow:0 0 12px rgba(255,215,0,.25); }
.title-cell .tn { font-size:14px; font-weight:900; color:var(--gold-soft); }
.title-cell.own .tn { color:var(--gold); }
.title-cell .th { font-size:10px; color:var(--dim); margin-top:4px; line-height:1.5; }
.title-cell.eq .th { color:var(--gold); font-weight:700; }

/* ===== 底部导航 ===== */
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; gap:6px;
  max-width:520px; margin:0 auto; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(15,8,4,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); }
.tabbar button { flex:1; min-height:48px; border:none; background:none; font-family:inherit; font-size:11px;
  color:var(--dim); border-radius:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; position:relative; }
.tabbar button .t-ico { font-size:20px; line-height:1; transition:transform .15s ease; }
.tabbar button.on { color:var(--gold); }
.tabbar button.on .t-ico { transform:translateY(-1px) scale(1.12); text-shadow:0 0 12px rgba(255,215,0,.6); }
.tabbar .dot { position:absolute; top:6px; right:calc(50% - 22px); background:var(--red); color:#fff; border-radius:999px;
  min-width:16px; height:16px; font-size:10px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

/* ===== 弹层 ===== */
#mask { display:none; position:fixed; inset:0; z-index:50; background:rgba(5,2,0,.72); backdrop-filter:blur(4px);
  align-items:flex-end; justify-content:center; }
#mask.on { display:flex; }
.sheet { width:100%; max-width:520px; max-height:86dvh; overflow-y:auto; background:#160c07;
  border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .25s ease; }
@keyframes up { from{transform:translateY(40px); opacity:.4;} to{transform:none; opacity:1;} }
.sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sheet-head .t { font-size:16px; font-weight:900; color:var(--gold-soft); }
.sheet-close { width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:none;
  color:var(--dim); font-size:14px; cursor:pointer; }
.f-row { margin-bottom:12px; }
.f-label { font-size:12px; color:var(--dim); margin-bottom:6px; }
.f-input, .f-select { width:100%; min-height:44px; border-radius:10px; border:1px solid rgba(205,127,50,.4);
  background:rgba(10,5,2,.5); color:var(--text); font-family:inherit; font-size:15px; padding:8px 12px; }
.f-input:focus { outline:none; border-color:var(--gold); }
.f-2col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.big-btn { width:100%; min-height:48px; border:none; border-radius:12px; font-family:inherit; font-size:15px; font-weight:900;
  color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32); box-shadow:0 3px 10px rgba(205,127,50,.35); cursor:pointer; margin-top:6px; }
.ghost-btn { width:100%; min-height:44px; border-radius:12px; font-family:inherit; font-size:14px; font-weight:700;
  color:var(--gold-soft); background:rgba(205,127,50,.14); border:1px solid rgba(205,127,50,.5); cursor:pointer; margin-top:8px; }
.danger-btn { width:100%; min-height:44px; border-radius:12px; font-family:inherit; font-size:13px; color:var(--red);
  background:rgba(255,110,90,.08); border:1px solid rgba(255,110,90,.35); cursor:pointer; margin-top:14px; }
textarea.f-input { min-height:90px; resize:vertical; }

/* 后台 Tabs */
.sub-tabs { display:flex; gap:6px; margin-bottom:14px; }
.sub-tabs button { flex:1; min-height:38px; border-radius:10px; border:1px solid var(--line); background:none;
  color:var(--dim); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
.sub-tabs button.on { color:#2a1503; background:linear-gradient(145deg,#FFD700,#CD7F32); border:none; }
.cfg-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed rgba(205,127,50,.18); }
.cfg-row:last-child { border-bottom:none; }
.cfg-name { flex:1; min-width:0; font-size:14px; font-weight:700; }
.cfg-name .s { display:block; font-size:11px; color:var(--dim); font-weight:400; margin-top:2px; }
.cfg-num { width:86px; min-height:40px; text-align:center; border-radius:10px; border:1px solid rgba(205,127,50,.4);
  background:rgba(10,5,2,.5); color:var(--gold); font-family:inherit; font-size:15px; font-weight:700; }
.cfg-num.sm { width:62px; }
.cfg-tog { width:52px; height:30px; border-radius:999px; border:1px solid rgba(205,127,50,.5); background:rgba(10,5,2,.5);
  position:relative; cursor:pointer; flex:none; }
.cfg-tog::after { content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:var(--dim); transition:all .2s ease; }
.cfg-tog.on { background:rgba(205,127,50,.4); }
.cfg-tog.on::after { left:25px; background:var(--gold); }
.tiergrp { margin-bottom:12px; }
.tiergrp .g-name { font-size:13px; font-weight:900; color:var(--gold-soft); margin-bottom:6px; }
.tiergrp .g-row { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.tiergrp .g-cell { background:var(--panel2); border:1px solid rgba(205,127,50,.18); border-radius:10px; padding:8px 4px; }
.tiergrp .g-cell .cn { font-size:11px; color:var(--dim); text-align:center; }
.tiergrp .g-cell input { width:100%; margin-top:4px; text-align:center; min-height:34px; border-radius:8px;
  border:1px solid rgba(205,127,50,.4); background:rgba(10,5,2,.5); color:var(--gold); font-family:inherit; font-size:13px; font-weight:700; }

/* 开盒动画 */
.box-anim { text-align:center; padding:20px 0; }
.box-anim .big { font-size:80px; display:inline-block; animation:shake .5s ease infinite; }
@keyframes shake { 0%,100%{transform:rotate(-8deg) scale(1);} 50%{transform:rotate(8deg) scale(1.12);} }

/* ===== 升段庆祝 + 彩带 ===== */
#celebrate { display:none; position:fixed; inset:0; z-index:80; background:rgba(5,2,0,.92);

#celebrate.on { display:flex; animation:celebIn .4s ease; }

#celebrate .c-emoji { font-size:96px; animation:popIn .6s cubic-bezier(.2,1.6,.4,1); }
#celebrate.grand .c-emoji { animation:popIn .6s cubic-bezier(.2,1.6,.4,1), spinGlow 1.2s ease; }
@keyframes popIn { from{transform:scale(0);} to{transform:scale(1);} }
@keyframes spinGlow { 0%{filter:drop-shadow(0 0 10px #FFD700);} 50%{filter:drop-shadow(0 0 40px #FFD700);} 100%{filter:drop-shadow(0 0 14px #FFD700);} }
#celebrate .c-title { font-size:30px; font-weight:900; color:var(--gold); margin-top:14px; text-shadow:0 0 24px rgba(255,215,0,.6); }
#celebrate .c-sub { font-size:14px; color:var(--gold-soft); margin-top:10px; line-height:1.8; }
#celebrate .c-tap { position:absolute; bottom:calc(30px + env(safe-area-inset-bottom)); font-size:12px; color:var(--dim); }
#celebrate .c-star { position:absolute; font-size:22px; animation:floatUp 1.6s ease forwards; }
@keyframes floatUp { from{opacity:1; transform:translateY(0) rotate(0);} to{opacity:0; transform:translateY(-120px) rotate(40deg);} }
.confetti { position:fixed; top:-20px; z-index:90; width:10px; height:14px; border-radius:2px;
  animation:fall linear forwards; pointer-events:none; }
@keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.6; } }
.toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:rgba(22,12,7,.95); border:1px solid var(--gold); color:var(--gold-soft); font-size:13px; font-weight:700;
  padding:10px 18px; border-radius:999px; z-index:95; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88vw; text-align:center; }
.toast.on { opacity:1; }
.small-note { font-size:11px; color:var(--dim); text-align:center; line-height:1.7; margin-top:8px; }

/* ===== 登录页 ===== */
#loginView { display:none; position:fixed; inset:0; z-index:70;

/* 一次性补发：旧账本积累的积分没领过升级盲盒，按 V3 门槛表把当前积分重走一遍补齐 */
function compensateBoxes() {
  if (!S || !S.child || S.child.boxCompensated) return;
  var pts = S.child.points;
  var ups = 0, grands = 0;
  for (var i = 1; i < S.config.tiers.length; i++) {
    if (pts >= S.config.tiers[i].threshold) {
      ups++;
      if (S.config.tiers[i].short !== S.config.tiers[i - 1].short) grands++;
    }
  }
  var k = S.config.king;
  if (pts >= k.entry) {
    var stars = Math.floor((pts - k.entry) / k.perStar);
    ups += stars;
    if (stars >= k.legendStar) grands++;
    if (stars >= k.gloryStar) grands++;
  }
  var g, n;
  for (g = 0; g < grands; g++) grantBox('grand');
  for (n = 0; n < ups - grands; n++) grantBox('normal');
  S.child.boxCompensated = true;
  if (ups > 0) toast('🎁 补发历史升级盲盒 ×' + ups + '（含高级盒×' + grands + '），去背包开！');
  save();
}
function migrateV3() {
  /* v1/v2 → v3：换王者段位制与 14 任务；积分/流水/开盒/兑换保留；
     任务与段位配置重置为 V3 默认（自定义分值需重新设置），成就道具称号从零开始 */
  var oldName = '';
  try {
    var ts = S.config.tiers || [];
    for (var i = 0; i < ts.length; i++) if (S.child.points >= ts[i].threshold) oldName = ts[i].name;
  } catch (e2) { }
  S.version = 3;
  S.config.tasks = defaultTasks();
  S.config.tiers = defaultTiers();
  S.config.king = defaultKing();
  S.config.system = { exchangeRate:10, weekBonus:50, monthBonus:300, hundredBonus:800, birthday:500, birthdayMult:2.0, birthdayDate:'07-20', pity:10 };
  if (!S.lastExportAt && S.lastExportAt !== null) S.lastExportAt = null;
  var c = S.child;
  c.items = c.items || { dbDay:0, dbWeek:0, game1:0, game3:0, freeDay:0 };
  c.activeBuff = null; c.buffHistory = c.buffHistory || [];
  c.couponUsed = c.couponUsed || []; c.titlesOwned = []; c.equippedTitle = null;
  c.achievementsDone = []; c.pityCount = 0;
  /* checkins 数组格式 → 计数格式 */
  var nc = {};
  Object.keys(c.checkins || {}).forEach(function (d) {
    var v = c.checkins[d], obj = {};
    if (Array.isArray(v)) { v.forEach(function (tid) { obj[tid] = (obj[tid] || 0) + 1; }); }
    else { obj = v; }
    nc[d] = obj;
  });
  c.checkins = nc;
  /* 旧版开盒记录没有 item 字段，统一补为 points */
  (c.openedBoxes || []).forEach(function (b) { if (!b.item) b.item = 'points'; });
  S.pending = [];
  var info = levelInfo(c.points);
  c.bestLevelIdx = info.isKing ? S.config.tiers.length : info.idx;
  c.kingStarsBest = info.isKing ? info.kingStars : 0;
  c.tierHistory = c.tierHistory || [];
  c.tierHistory.unshift({ date: todayStr(), from: oldName || '旧版本段位', to: info.name, grand: false,
    note: 'V3 段位重制（王者荣耀制）自动重算' });
  save();
}

/* ================= 段位逻辑 ================= */
function levelIdxOf(points) {
  var ts = S.config.tiers, idx = 0;
  for (var i = 0; i < ts.length; i++) { if (points >= ts[i].threshold) idx = i; }
  return idx;
}
function levelInfo(points) {
  var k = S.config.king;
  if (points >= k.entry) {
    return { isKing: true, idx: S.config.tiers.length, kingStars: Math.floor((points - k.entry) / k.perStar),
      name: TIER_FULL['王者'], short: '王者', stars: 0, maxStars: 0, bonus: k.bonus, threshold: k.entry };
  }
  var idx = levelIdxOf(points), t = S.config.tiers[idx];
  var next = idx + 1 < S.config.tiers.length ? S.config.tiers[idx + 1] : { threshold: k.entry };
  var span = Math.max(1, next.threshold - t.threshold);
  var stars = Math.min(t.stars - 1, Math.floor((points - t.threshold) / span * t.stars));
  return { isKing: false, idx: idx, kingStars: 0, name: t.name, short: t.short, stars: stars,
    maxStars: t.stars, bonus: t.bonus, threshold: t.threshold };
}
function curLevel() { return levelInfo(S.child.points); }
function nextMilestone() {
  var info = levelInfo(S.child.points);
  if (info.isKing) {
    var k = S.config.king;
    var nextAt = k.entry + (info.kingStars + 1) * k.perStar;
    return { name: '王者 ' + (info.kingStars + 1) + '★', pointsNeeded: nextAt - S.child.points, threshold: info.threshold, span: k.perStar };
  }
  var next = info.idx + 1 < S.config.tiers.length ? S.config.tiers[info.idx + 1] : { name: TIER_FULL['王者'], threshold: S.config.king.entry };
  var span = next.threshold - info.threshold;
  return { name: next.name, pointsNeeded: next.threshold - S.child.points, threshold: info.threshold, span: span };
}

/* ================= 倍率 ================= */
function inBirthdayWeek() {
  var d = new Date();
  var md = (d.getMonth()+1) * 100 + d.getDate();
  return md >= 717 && md <= 723;
}
function buffActive() {
  var b = S.child.activeBuff;
  if (!b) return false;
  return todayStr() <= b.expire;
}
function buffLeftDays() {
  var b = S.child.activeBuff;
  if (!b || !buffActive()) return 0;
  var p = todayStr().split('-'), e = b.expire.split('-');
  var d1 = new Date(+p[0], +p[1]-1, +p[2]), d2 = new Date(+e[0], +e[1]-1, +e[2]);
  return Math.round((d2 - d1) / 86400000) + 1;
}
function earnMultiplier() {
  var doubled = inBirthdayWeek() || buffActive();
  return curLevel().bonus * (doubled ? 2 : 1);
}

/* ================= 记账核心 ================= */
function grantBox(kind) {
  var box = { id: 'b' + (S.child.boxSeq++), kind: kind, ts: new Date().toISOString() };
  S.child.blindboxes.push(box);
  return box;
}
function addPoints(delta, type, desc) {
  var before = levelInfo(S.child.points);
  S.child.points = Math.max(0, S.child.points + delta);
  S.child.transactions.unshift({ date: todayStr(), type: type, amount: delta, desc: desc || '' });
  if (S.child.transactions.length > 300) S.child.transactions.length = 300;
  var after = levelInfo(S.child.points);
  if (after.idx > before.idx) {
    var crossGrand = after.short !== before.short;
    var entry = { date: todayStr(), from: before.name, to: after.name, grand: crossGrand, note: '' };
    if (after.isKing) entry.note = '晋级最强王者！';
    S.child.tierHistory.unshift(entry);
    if (after.idx > (S.child.bestLevelIdx || 0)) S.child.bestLevelIdx = after.idx;
    grantBox(crossGrand ? 'grand' : 'normal');
    showCelebrate(crossGrand || after.isKing, after);
  } else if (after.isKing && before.isKing && after.kingStars > before.kingStars) {
    for (var st = before.kingStars + 1; st <= after.kingStars; st++) {
      S.child.tierHistory.unshift({ date: todayStr(), from: '王者 ' + before.kingStars + '★', to: '王者 ' + st + '★', grand: false, note: '' });
      grantBox('normal');
      if (st === S.config.king.legendStar) { grantBox('grand'); grantTitle('legendKing'); showCelebrate(true, { short:'王者', name:'传奇王者 · 王者25★' }); }
      if (st === S.config.king.gloryStar) { grantBox('grand'); grantTitle('gloryKing'); showCelebrate(true, { short:'王者', name:'荣耀王者 · 王者50★' }); }
    }
    if (after.kingStars > (S.child.kingStarsBest || 0)) S.child.kingStarsBest = after.kingStars;
  }
  save();
}

function weekKey() { var d = new Date(); var mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return mon.toISOString().slice(0, 10); }

/* ================= 盲盒 ================= */
function weightedPick(pool) {
  var total = 0; pool.forEach(function (e) { total += e.w; });
  var r = Math.random() * total;
  for (var i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) return pool[i].item; }
  return pool[pool.length - 1].item;
}
function openBox(bid) {
  if (!canOpenBox()) { toast('盲盒只能由 ' + S.child.name + ' 本人开启 🔒'); return; }
  var i = S.child.blindboxes.findIndex(function (b) { return b.id === bid; });
  if (i < 0) return;
  var box = S.child.blindboxes[i];
  S.child.blindboxes.splice(i, 1);
  var pool = BOX_POOLS[box.kind === 'normal' ? 'normal' : 'grand'];
  var item;
  var pity = S.config.system.pity || 10;
  if (S.child.pityCount + 1 >= pity) {
    var nonPts = pool.filter(function (e) { return e.item !== 'points'; });
    item = weightedPick(nonPts);
  } else {
    item = weightedPick(pool);
  }
  var result;
  if (item === 'points') {
    S.child.pityCount++;
    var rg = BOX_KIND_META[box.kind].range;
    var got = rg[0] + Math.floor(Math.random() * (rg[1] - rg[0] + 1));
    addPoints(got, '盲盒奖励', BOX_KIND_META[box.kind].name + ' 开出 +' + got);
    result = { item: 'points', got: got };
  } else {
    S.child.pityCount = 0;
    S.child.items[item] = (S.child.items[item] || 0) + 1;
    if (item === 'dbWeek') grantTitle('rateMaster');
    if (item === 'game3') grantTitle('timeLord');
    if (item === 'freeDay') grantTitle('freeGod');
    save();
    result = { item: item, got: 0 };
  }
  S.child.openedBoxes.unshift({ id: box.id, kind: box.kind, item: result.item, got: result.got, ts: new Date().toISOString() });
  checkAchievements();
  save(); renderAll();
  showBoxResult(box.kind, result);
  if (RARE_ITEMS.indexOf(result.item) >= 0) confettiBurst();
}

/* ================= 道具 ================= */
function activateBuff(type) {
  if (!canUseItem()) { toast('道具由明哲自己使用（爸爸可代操作）'); return; }
  if (!buffActive() && S.child.items[type] > 0) {
    S.child.items[type]--;
    var days = type === 'dbWeek' ? 7 : 1;
    S.child.activeBuff = { type: type, start: todayStr(), days: days, expire: addDays(todayStr(), days - 1) };
    S.child.buffHistory.unshift({ type: type, start: todayStr(), days: days });
    save(); checkAchievements(); renderAll();
    toast('⚡ 双倍积分卡已激活，' + days + ' 天内任务积分 ×2');
  }
}
function useCoupon(item) {
  if (!canUseItem()) { toast('道具由明哲自己使用（爸爸可代操作）'); return; }
  if ((S.child.items[item] || 0) <= 0) return;
  S.pending.push({ id: 'p' + Date.now() + Math.floor(Math.random()*100), kind: 'coupon', item: item, ts: nowTime() });
  save(); renderAll();
  toast('已申请使用，等家长确认 📩');
}

/* ================= 称号 ================= */
function grantTitle(tid) {
  if (S.child.titlesOwned.indexOf(tid) < 0) {
    S.child.titlesOwned.push(tid);
    var t = TITLES.find(function (x) { return x.id === tid; });
    toast('👑 获得限定称号：「' + (t ? t.name : tid) + '」');
    save();
  }
}

/* ================= 成就 ================= */
function checkAchievements() {
  var h = heroHook();
  ACHIEVEMENTS.forEach(function (a) {
    if (S.child.achievementsDone.indexOf(a.id) >= 0) return;
    var ok = false;
    try { ok = !!a.cond(S, h); } catch (e) { ok = false; }
    if (ok) {
      S.child.achievementsDone.push(a.id);
      toast('🏆 达成成就：「' + a.name + '」');
      if (a.top) {
        grantBox('memorial');
        toast('🎖️ 顶级成就！奖励纪念盲盒一个');
      }
    }
  });
  save();
}
function heroHook() {
  return { streakDays: streakDays, levelInfo: levelInfo };
}

function renderChart() {
  var cv = $('weekChart');
  if (!cv) return;
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || cv.parentElement.clientWidth;
  var h = 150;
  cv.width = w * dpr; cv.height = h * dpr;
  var ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  var monday = new Date(); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  var days = [], data = [];
  for (var i = 0; i < 7; i++) {
    var dd = new Date(monday); dd.setDate(monday.getDate() + i);
    var ds = dd.getFullYear() + '-' + String(dd.getMonth()+1).padStart(2,'0') + '-' + String(dd.getDate()).padStart(2,'0');
    var sum = 0;
    S.child.transactions.forEach(function (t) { if (t.date === ds && t.amount > 0) sum += t.amount; });
    days.push(['周一','周二','周三','周四','周五','周六','周日'][i]); data.push(sum);
  }
  var max = Math.max(20, Math.max.apply(null, data));
  var padL = 8, padR = 8, padT = 20, padB = 24;
  var cw = (w - padL - padR) / 7, chartH = h - padT - padB;
  ctx.strokeStyle = 'rgba(205,127,50,.25)';
  ctx.beginPath(); ctx.moveTo(padL, padT + chartH + .5); ctx.lineTo(w - padR, padT + chartH + .5); ctx.stroke();
  var todayIdx = (new Date().getDay() + 6) % 7;
  data.forEach(function (v, i) {
    var bw = Math.min(24, cw * 0.5);
    var x = padL + cw * i + (cw - bw) / 2;
    var bh = v > 0 ? Math.max(6, v / max * chartH) : 2;
    var y = padT + chartH - bh;
    var g = ctx.createLinearGradient(0, y, 0, padT + chartH);
    g.addColorStop(0, '#FFD700'); g.addColorStop(1, 'rgba(205,127,50,.35)');
    ctx.fillStyle = v > 0 ? g : 'rgba(205,127,50,.18)';
    ctx.beginPath(); ctx.roundRect(x, y, bw, bh, 4); ctx.fill();
    if (v > 0) {
      ctx.fillStyle = '#f5d78e'; ctx.font = "700 11px 'Noto Sans SC', sans-serif"; ctx.textAlign = 'center';
      ctx.fillText('+' + v, x + bw / 2, y - 5);
    }
    ctx.fillStyle = i === todayIdx ? '#FFD700' : '#b89f85';
    ctx.font = (i === todayIdx ? '700 ' : '') + "11px 'Noto Sans SC', sans-serif";
    ctx.textAlign = 'center'; ctx.fillText(days[i], x + bw / 2, h - 8);
  });
}

      '<span class="ms-st">' + (m.granted ? '✅ 已发放' : (reached ? '🌟 已达成' : '🔒 升到' + esc(TIER_FULL[m.tier] || m.tier) + '解锁')) + '</span></div>' +
      '<div class="ms-desc">' + esc(m.desc) + '</div>' + grantBtn + '</div>';
  }).join('') : '<div class="empty">还没有设置愿望，找爸妈加一个吧</div>';
  document.querySelectorAll('#msList [data-msgrant]').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = S.config.milestones.find(function (x) { return x.id === b.dataset.msgrant; });
      if (m) { m.granted = true; m.grantedAt = todayStr(); save(); renderAll(); toast('已发放：' + m.name + ' 🎉'); }
    });
  });

  checkAchievements();
  var doneN = S.child.achievementsDone.length;
  $('achvCount').textContent = doneN + '/' + ACHIEVEMENTS.length;
  $('achvGrid').innerHTML = ACHIEVEMENTS.map(function (a) {
    var got = S.child.achievementsDone.indexOf(a.id) >= 0;
    return '<div class="achv' + (got ? ' got' : '') + '">' +
      (a.top ? '<span class="topmark">🎖️</span>' : '') +
      '<div class="ico">' + a.icon + '</div>' +
      '<div class="nm">' + a.name + '</div><div class="st">' + (got ? '已达成' : a.desc) + '</div></div>';
  }).join('');
  $('dataNote').textContent = '数据保存在本机浏览器 · 最近更新 ' + (S.updatedAt || '').slice(0, 16).replace('T', ' ') + ' · 记得定期导出备份';
}

function renderAll() { renderHeader(); renderHome(); renderChart(); renderTier(); renderBag(); renderMe(); }

/* ================= Tab 切换 ================= */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function (s) { s.classList.toggle('on', s.id === 'tab-' + name); });
  document.querySelectorAll('.tabbar button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
  if (name === 'home') requestAnimationFrame(renderChart);
}
$('tabbar').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-tab]');
  if (b) switchTab(b.dataset.tab);
});

/* ================= 登录/角色 ================= */
var loginRole = null;
function showLogin() {
  var users = [['dad', '👨'], ['mom', '👩'], ['son', '🦸']];
  $('lgUsers').innerHTML = users.map(function (u) {
    var nm = u[0] === 'son' ? S.child.name : S.config.accounts[u[0]].name;
    return '<button class="lg-user" data-role="' + u[0] + '"><span class="e">' + u[1] + '</span><span class="n">' + esc(nm) + '</span></button>';
  }).join('');
  $('lgUsers').querySelectorAll('.lg-user').forEach(function (b) {
    b.addEventListener('click', function () {
      loginRole = b.dataset.role;
      $('lgWho').textContent = (loginRole === 'son' ? S.child.name : S.config.accounts[loginRole].name) + ' · 请输入 PIN';
      $('lgPinBox').style.display = '';
      $('lgPin').value = '';
      try { $('lgPin').focus(); } catch (e) { }
    });
  });
  $('lgPinBox').style.display = 'none';
  $('loginView').classList.add('on');
}
function tryLogin() {
  if (!loginRole) return;
  if ($('lgPin').value === S.config.accounts[loginRole].pin) {
    sessionStorage.setItem('hero_role', loginRole);
    var who = loginRole === 'son' ? S.child.name : S.config.accounts[loginRole].name;
    loginRole = null;
    $('loginView').classList.remove('on');
    renderAll();
    checkBirthday();
    checkAchievements();
    toast('欢迎，' + who + '！');
  } else {
    toast('PIN 不对，再试试');
    $('lgPin').value = '';
  }
}
$('lgGo').addEventListener('click', tryLogin);
$('lgPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
$('lgBack').addEventListener('click', function () { $('lgPinBox').style.display = 'none'; loginRole = null; });
$('roleBtn').addEventListener('click', function () {
  if (!currentRole()) { showLogin(); return; }
  sessionStorage.removeItem('hero_role');
  renderHeader();
  showLogin();
  toast('已退出');
});
$('pbConfirm').addEventListener('click', function () { switchTab('home'); window.scrollTo(0, 0); });
$('pbRedeem').addEventListener('click', openRedeemSheet);
$('pbAdmin').addEventListener('click', openAdminSheet);
$('pbData').addEventListener('click', openDataSheet);
$('backupStrip').addEventListener('click', openDataSheet);
$('pbExit').addEventListener('click', function () {
  sessionStorage.removeItem('hero_role');
  showLogin();
  toast('已退出');
});

/* ================= 启动 ================= */
load();
sessionStorage.removeItem('hero_parent'); /* 旧版家长标记废弃 */
if (currentRole()) {
  renderAll();
  checkBirthday();
  checkAchievements();
} else {
  renderHeader();
  showLogin();
}
var resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderChart, 150);
});
/* 测试钩子：仅供自动化验收与排查用 */
window.__hero = {
  get state() { return S; },
  save: save, load: load, seed: seed,
  addPoints: addPoints, confirmPending: confirmPending, openBox: openBox,
  doCheckin: doCheckin, activateBuff: activateBuff, useCoupon: useCoupon,
  levelInfo: levelInfo, streakDays: streakDays, checkAchievements: checkAchievements,
  grantBox: grantBox, weightedPick: weightedPick,
  login: function (role) { sessionStorage.setItem('hero_role', role); document.getElementById('loginView').classList.remove('on'); renderAll(); },
  logout: function () { sessionStorage.removeItem('hero_role'); renderHeader(); showLogin(); }
};
</script>
</body>
</html>
